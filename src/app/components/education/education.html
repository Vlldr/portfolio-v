<section id="education" class="mx-auto max-w-5xl px-4 py-16">
  <p class="text-sm font-semibold uppercase tracking-wide text-primary">Explore My</p>
  <h2 class="text-3xl font-bold">Education</h2>
  <div class="mt-6 grid gap-6 md:grid-cols-2">
    @for (item of items(); track item.title) {
      <div class="card border border-base-300 bg-base-100 shadow-sm">
        <div class="card-body">
          <h3 class="card-title">{{ item.title }}</h3>
          <p class="opacity-80">{{ item.detail }}</p>
        </div>
      </div>
    }
  </div>
</section>
