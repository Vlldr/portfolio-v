<section id="contact" class="mx-auto max-w-5xl px-4 py-16 text-center">
  <p class="text-sm font-semibold uppercase tracking-wide text-primary">Get in Touch</p>
  <h2 class="text-3xl font-bold">Contact Me</h2>
  <div class="mt-6 flex flex-wrap justify-center gap-4">
    @for (link of links(); track link.label) {
      <a [href]="link.href" target="_blank" rel="noopener" class="card border border-base-300 bg-base-100 px-6 py-4 shadow-sm">
        <span class="text-sm opacity-70">{{ link.label }}</span>
        <span class="font-medium">{{ link.value }}</span>
      </a>
    }
  </div>
</section>
