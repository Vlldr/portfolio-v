<section id="projects" class="mx-auto max-w-5xl px-4 py-16">
  <p class="text-sm font-semibold uppercase tracking-wide text-primary">Browse My Recent</p>
  <h2 class="text-3xl font-bold">Projects</h2>
  <div class="mt-6 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    @for (project of projects(); track project.title) {
      <article class="card overflow-hidden border border-base-300 bg-base-100 shadow-sm">
        @if (project.image) {
          <figure>
            <img [src]="project.image" [alt]="project.title + ' poster'" class="aspect-[4/3] w-full object-cover" loading="lazy" />
          </figure>
        }
        <div class="card-body">
          <h3 class="card-title">{{ project.title }}</h3>
          <div class="card-actions mt-4 justify-end">
            <a [href]="project.repoUrl" target="_blank" rel="noopener" class="btn btn-sm btn-ghost">GitHub</a>
            <a [href]="project.demoUrl" target="_blank" rel="noopener" class="btn btn-sm btn-primary">Live Demo</a>
          </div>
        </div>
      </article>
    }
  </div>
</section>
